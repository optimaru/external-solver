# Releasing is driven by the version in pyproject.toml. On a push to main, if
# there is no `v<version>` tag yet, the publish job uploads the sdist and wheel
# to PyPI, then tags the commit and creates a GitHub release with the same
# files. If the tag already exists, nothing is published. So to release: bump
# `version` in pyproject.toml in a PR and merge it.
#
# PyPI upload uses Trusted Publishing (OIDC). The PyPI project lists this
# repository as a trusted publisher:
#   owner: optimaru · repository: external-solver · workflow: publish.yml · environment: pypi
# and the GitHub Environment `pypi` must exist.
name: publish

on:
  pull_request:
    paths: [pyproject.toml, src/**, .github/workflows/publish.yml]
  push:
    branches: [main]
    paths: [pyproject.toml, src/**, .github/workflows/publish.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Read version and check for an existing tag
        id: v
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then exists=true; else exists=false; fi
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ] && [ "${exists}" = "false" ]; then
            release=true
          else
            release=false
          fi
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "### external-solver ${version} · tag exists: ${exists} · publish: ${release}" >> "$GITHUB_STEP_SUMMARY"
      - name: Build sdist and wheel
        run: uv build
      - name: Smoke-test the wheel
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c "import importlib, external_solver as e; [importlib.import_module(f'external_solver.{n}').catalog() for n in e.__all__]"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish v${{ needs.build.outputs.version }}
    if: needs.build.outputs.release == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/external-solver/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # PyPI first: if the upload fails, no tag is created and the next push retries.
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "external-solver ${VERSION}" \
            --generate-notes \
            --notes "pip install external-solver==${VERSION}"
