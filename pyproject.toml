[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "external-solver"
version = "0.2.0"
description = "Exact CP-SAT models for the optimaru use cases: same problem JSON, same constraint selection, rescored by the engine."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "optimaru" }]
keywords = ["optimization", "constraint-programming", "cp-sat", "scheduling", "operations-research", "solver"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  # Problem models, constraint specs and the scorer every result is rescored with.
  "optimaru>=0.4,<0.5",
  "ortools>=9.10",
  "pydantic>=2.5",
]

[project.urls]
Homepage = "https://optimaru.com"
Source = "https://github.com/optimaru/external-solver"

[dependency-groups]
dev = ["pytest>=8", "numpy", "ruff"]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
external_solver = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
extend-exclude = ["tests"]

[tool.ruff.lint]
extend-select = ["I"]
